[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quark_vfs"
version = "0.1.0"
description = "Account-scoped Quark file access with recoverable transfers and trash"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quark-vfs = "quark_vfs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quark_vfs"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
